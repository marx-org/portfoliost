openapi: "3.0.3"
info:
  title: Example service.ai API
  version: "1.0.0"
  description: |
    REST API for the Example service.ai AI-Powered Investment Portfolio Tracking platform.

    All endpoints require authentication via Bearer token (JWT) or session cookie
    obtained through the login or Google OAuth flow, unless otherwise noted.

    **Base URL:** https://app.example-service.ai

    **Notes:** API paths and schemas are inferred from UI analysis of application
    snapshots and screenshots. Actual implementation details may vary.
  contact:
    name: Example service.ai
    url: https://example-service.ai/contact
  license:
    name: Proprietary

servers:
  - url: https://app.example-service.ai/api/v1
    description: Production API
  - url: https://app.example-service.ai/en/api
    description: Production API (locale-prefixed variant)

tags:
  - name: Authentication
    description: Login, logout, registration, password management
  - name: User
    description: User profile and account management
  - name: Portfolios
    description: Investment portfolio CRUD and analytics
  - name: Positions
    description: Portfolio position management (buy, sell, dividend, edit, remove)
  - name: Transactions
    description: Transaction history and management
  - name: CashWallets
    description: Cash wallet deposit, withdraw, transfer, and history
  - name: Watchlists
    description: Stock watchlist management
  - name: Instruments
    description: Stock/ETF/crypto research, price data, and fundamentals
  - name: News
    description: Market news aggregation
  - name: Alerts
    description: Notification alerts and settings
  - name: Settings
    description: User settings, billing, broker connections
  - name: Copilot
    description: AI Copilot chat assistant

paths:

  # ─────────────────────────────────────────────
  # AUTHENTICATION
  # ─────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      operationId: loginWithEmailPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current session
      operationId: logout
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset email
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/google:
    get:
      tags: [Authentication]
      summary: Initiate Google OAuth login
      operationId: googleOAuthInitiate
      responses:
        '302':
          description: Redirect to Google OAuth consent screen

  # ─────────────────────────────────────────────
  # USER / PROFILE
  # ─────────────────────────────────────────────

  /users/me:
    get:
      tags: [User]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [User]
      summary: Update user profile (first/last name)
      operationId: updateUserProfile
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      tags: [User]
      summary: Delete user account permanently
      operationId: deleteAccount
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Account deleted

  /users/me/change-password:
    post:
      tags: [User]
      summary: Change user password
      operationId: changePassword
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /users/me/language:
    patch:
      tags: [User]
      summary: Update language preference
      operationId: updateLanguage
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language:
                  type: string
                  example: en
                  description: ISO 639-1 language code
      responses:
        '200':
          description: Language updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/me/data:
    delete:
      tags: [User]
      summary: Clear all account data (portfolios, wallets, transactions)
      operationId: clearAccountData
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Data cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ─────────────────────────────────────────────
  # PORTFOLIOS
  # ─────────────────────────────────────────────

  /portfolios:
    get:
      tags: [Portfolios]
      summary: List all investment portfolios and cash wallets
      operationId: listPortfolios
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: currency
          in: query
          schema:
            type: string
            example: USD
          description: Display currency code
      responses:
        '200':
          description: Portfolio list with summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioListResponse'

    post:
      tags: [Portfolios]
      summary: Create a new investment portfolio
      operationId: createPortfolio
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortfolioRequest'
      responses:
        '201':
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'

  /portfolios/{portfolioId}:
    parameters:
      - $ref: '#/components/parameters/portfolioId'

    get:
      tags: [Portfolios]
      summary: Get portfolio details with positions
      operationId: getPortfolio
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: currency
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Portfolio detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Portfolios]
      summary: Update portfolio (rename)
      operationId: updatePortfolio
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Portfolio updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'

    delete:
      tags: [Portfolios]
      summary: Delete portfolio and all its data
      operationId: deletePortfolio
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Portfolio deleted

  /portfolios/{portfolioId}/chart:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Portfolios]
      summary: Get portfolio value chart data
      operationId: getPortfolioChart
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [1D, 1W, 1M, 3M, 6M, 1Y, ALL]
            default: 1M
        - name: currency
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Chart time-series data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'

  /portfolios/{portfolioId}/performance:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Portfolios]
      summary: Get portfolio performance metrics
      operationId: getPortfolioPerformance
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [1D, 1W, 1M, 3M, 6M, 1Y, ALL]
      responses:
        '200':
          description: Performance data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceData'

  /portfolios/{portfolioId}/allocation:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Portfolios]
      summary: Get portfolio allocation breakdown
      operationId: getPortfolioAllocation
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Allocation data by symbol, sector, type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationData'

  /portfolios/{portfolioId}/risk-analysis:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Portfolios]
      summary: Get portfolio risk analysis metrics
      operationId: getPortfolioRiskAnalysis
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Risk metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAnalysisData'

  /portfolios/{portfolioId}/dividends:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Portfolios]
      summary: Get portfolio dividend history
      operationId: getPortfolioDividends
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Dividend data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendData'

  /portfolios/{portfolioId}/news:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Portfolios]
      summary: Get news relevant to portfolio holdings
      operationId: getPortfolioNews
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: News articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsListResponse'

  /portfolios/{portfolioId}/compare:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Portfolios]
      summary: Compare portfolio against benchmarks
      operationId: getPortfolioCompare
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Comparison data

  /portfolios/{portfolioId}/calendar:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Portfolios]
      summary: Get investor calendar events for portfolio (Premium)
      operationId: getPortfolioCalendar
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Calendar events
        '402':
          description: Premium feature — upgrade required

  /portfolios/{portfolioId}/share:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    post:
      tags: [Portfolios]
      summary: Generate shareable portfolio link
      operationId: sharePortfolio
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Share URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  share_url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true

  /portfolios/{portfolioId}/positions/export:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Portfolios]
      summary: Export positions as CSV or Excel
      operationId: exportPositions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
      responses:
        '200':
          description: File download
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /portfolios/{portfolioId}/ai-insights:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Portfolios]
      summary: Get AI portfolio insights (Premium)
      operationId: getPortfolioAIInsights
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: AI insights about portfolio performance drivers
        '402':
          description: Premium feature — upgrade required

  # ─────────────────────────────────────────────
  # POSITIONS
  # ─────────────────────────────────────────────

  /portfolios/{portfolioId}/positions:
    parameters:
      - $ref: '#/components/parameters/portfolioId'

    get:
      tags: [Positions]
      summary: List all positions in a portfolio
      operationId: listPositions
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Position list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionListResponse'

    post:
      tags: [Positions]
      summary: Add a new position (buy transaction)
      operationId: addPosition
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPositionRequest'
      responses:
        '201':
          description: Position created / updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddPositionResponse'

  /portfolios/{portfolioId}/positions/{positionId}:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
      - $ref: '#/components/parameters/positionId'

    patch:
      tags: [Positions]
      summary: Edit position transactions inline
      operationId: editPosition
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditPositionRequest'
      responses:
        '200':
          description: Position updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'

    delete:
      tags: [Positions]
      summary: Remove position and all its transactions
      operationId: removePosition
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Position removed

  /portfolios/{portfolioId}/positions/{positionId}/sell:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
      - $ref: '#/components/parameters/positionId'

    post:
      tags: [Positions]
      summary: Sell (partial or full) position
      operationId: sellPosition
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellPositionRequest'
      responses:
        '200':
          description: Sell transaction recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellPositionResponse'

  /portfolios/{portfolioId}/positions/{positionId}/dividends:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
      - $ref: '#/components/parameters/positionId'

    post:
      tags: [Positions]
      summary: Record dividend payment for position
      operationId: recordDividend
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDividendRequest'
      responses:
        '201':
          description: Dividend recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendRecord'

  # ─────────────────────────────────────────────
  # TRANSACTIONS
  # ─────────────────────────────────────────────

  /investments/transactions:
    get:
      tags: [Transactions]
      summary: List all transactions across all portfolios
      operationId: listAllTransactions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/dateFrom'
        - $ref: '#/components/parameters/dateTo'
        - name: type
          in: query
          schema:
            type: string
            enum: [Buy, Sell, Dividend]
        - name: symbol
          in: query
          schema:
            type: string
        - name: amount_min
          in: query
          schema:
            type: number
        - name: amount_max
          in: query
          schema:
            type: number
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/sortBy'
        - $ref: '#/components/parameters/sortDir'
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'

  /portfolios/{portfolioId}/transactions:
    parameters:
      - $ref: '#/components/parameters/portfolioId'

    get:
      tags: [Transactions]
      summary: List transactions for a specific portfolio
      operationId: listPortfolioTransactions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/dateFrom'
        - $ref: '#/components/parameters/dateTo'
        - name: type
          in: query
          schema:
            type: string
            enum: [Buy, Sell, Dividend]
        - name: symbol
          in: query
          schema:
            type: string
        - name: amount_min
          in: query
          schema:
            type: number
        - name: amount_max
          in: query
          schema:
            type: number
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/sortBy'
        - $ref: '#/components/parameters/sortDir'
      responses:
        '200':
          description: Transaction list with summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'

  /portfolios/{portfolioId}/transactions/export:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [Transactions]
      summary: Export transactions as CSV or Excel
      operationId: exportTransactions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
      responses:
        '200':
          description: File download

  /portfolios/{portfolioId}/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
      - $ref: '#/components/parameters/transactionId'

    put:
      tags: [Transactions]
      summary: Edit a transaction
      operationId: editTransaction
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTransactionRequest'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

    delete:
      tags: [Transactions]
      summary: Delete a transaction permanently
      operationId: deleteTransaction
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Transaction deleted

  # ─────────────────────────────────────────────
  # CASH WALLETS
  # ─────────────────────────────────────────────

  /wallets:
    get:
      tags: [CashWallets]
      summary: List all cash wallets
      operationId: listWallets
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Wallet list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletListResponse'

    post:
      tags: [CashWallets]
      summary: Create a new cash wallet
      operationId: createWallet
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletRequest'
      responses:
        '201':
          description: Wallet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashWallet'

  /wallets/{walletId}:
    parameters:
      - $ref: '#/components/parameters/walletId'

    get:
      tags: [CashWallets]
      summary: Get wallet details and chart data
      operationId: getWallet
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [1D, 1W, 1M, 3M, 6M, 1Y, ALL]
      responses:
        '200':
          description: Wallet detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashWallet'

    patch:
      tags: [CashWallets]
      summary: Update wallet (rename)
      operationId: updateWallet
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Wallet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashWallet'

    delete:
      tags: [CashWallets]
      summary: Delete cash wallet
      operationId: deleteWallet
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Wallet deleted

  /wallets/{walletId}/deposit:
    parameters:
      - $ref: '#/components/parameters/walletId'
    post:
      tags: [CashWallets]
      summary: Deposit funds into wallet
      operationId: depositFunds
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: Deposit recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashTransaction'

  /wallets/{walletId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/walletId'
    post:
      tags: [CashWallets]
      summary: Withdraw funds from wallet
      operationId: withdrawFunds
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '201':
          description: Withdrawal recorded
          content:
            application/json:
              schema:
