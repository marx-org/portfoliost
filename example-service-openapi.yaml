# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained via /auth/login
    cookieAuth:
      type: apiKey
      in: cookie
      name: example-service_session
      description: Session cookie set after login

  parameters:
    portfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Portfolio UUID
      example: 3cb589d8-f92d-428f-aeab-9ee5d4b9cef2

    positionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Position UUID

    transactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Transaction UUID

    walletId:
      name: walletId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cash wallet UUID

    watchlistId:
      name: watchlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Watchlist UUID

    symbol:
      name: symbol
      in: path
      required: true
      schema:
        type: string
      description: Instrument symbol with optional exchange suffix (e.g., AAPL.US)
      example: AAPL.US

    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1

    perPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        enum: [10, 20, 50, 100]

    dateFrom:
      name: date_from
      in: query
      schema:
        type: string
        format: date

    dateTo:
      name: date_to
      in: query
      schema:
        type: string
        format: date

    sortBy:
      name: sort_by
      in: query
      schema:
        type: string

    sortDir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:

    # ─── Auth ───────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember_me:
          type: boolean
          default: false

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string

    ResetPasswordRequest:
      type: object
      required: [token, password, password_confirmation]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
        redirect_url:
          type: string

    # ─── User ───────────────────────────────────

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        language:
          type: string
          example: en
        plan:
          type: string
          enum: [free, premium]
          default: free
        created_at:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string

    ChangePasswordRequest:
      type: object
      required: [new_password, confirm_password]
      properties:
        new_password:
          type: string
          format: password
          minLength: 8
          description: Must contain uppercase, lowercase, and a number
        confirm_password:
          type: string
          format: password

    # ─── Portfolio ──────────────────────────────

    Portfolio:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Top10
        strategy:
          type: string
          example: Growth
        description:
          type: string
          nullable: true
        currency:
          type: string
          example: USD
        total_value:
          type: number
          format: float
          example: 109916.76
        total_invested:
          type: number
          format: float
          example: 98083.40
        total_return_pct:
          type: number
          format: float
          example: 12.06
        unrealized_gain:
          type: number
          format: float
          example: 11833.36
        realized_gain:
          type: number
          format: float
          example: 0.00
        income:
          type: number
          format: float
          example: 0.00
        daily_change:
          type: number
          format: float
          example: 3576.36
        daily_change_pct:
          type: number
          format: float
          example: 3.36
        position_count:
          type: integer
          example: 10
        created_at:
          type: string
          format: date-time

    PortfolioDetail:
      allOf:
        - $ref: '#/components/schemas/Portfolio'
        - type: object
          properties:
            positions:
              type: array
              items:
                $ref: '#/components/schemas/Position'

    CreatePortfolioRequest:
      type: object
      required: [name, currency]
      properties:
        name:
          type: string
        strategy:
          type: string
        description:
          type: string
        currency:
          type: string
          example: USD

    PortfolioListResponse:
      type: object
      properties:
        investment_portfolios:
          type: array
          items:
            $ref: '#/components/schemas/Portfolio'
        cash_wallets:
          type: array
          items:
            $ref: '#/components/schemas/CashWallet'
        summary:
