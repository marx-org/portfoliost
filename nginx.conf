server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Per-module API backends ────────────────────────────────────────
    # Each module has its own env var so they can be migrated to a real
    # backend independently. All default to http://example-service-mock:4010.

    location /api/auth {
        proxy_pass ${API_AUTH_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users {
        proxy_pass ${API_USERS_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/portfolios {
        proxy_pass ${API_PORTFOLIOS_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/wallets {
        proxy_pass ${API_WALLETS_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/instruments {
        proxy_pass ${API_INSTRUMENTS_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/watchlists {
        proxy_pass ${API_WATCHLISTS_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/notifications {
        proxy_pass ${API_NOTIFICATIONS_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/news {
        proxy_pass ${API_NEWS_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/billing {
        proxy_pass ${API_BILLING_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/charting {
        proxy_pass ${API_CHARTING_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/conversations {
        proxy_pass ${API_COPILOT_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/chatbot {
        proxy_pass ${API_COPILOT_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/logos {
        proxy_pass ${API_LOGOS_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/exchange-rates {
        proxy_pass ${API_EXCHANGE_RATES_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/snaptrade {
        proxy_pass ${API_SNAPTRADE_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/public {
        proxy_pass ${API_PUBLIC_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Catch-all ─────────────────────────────────────────────────────
    # Any /api/ path not matched above goes here.
    location /api {
        proxy_pass ${API_BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
