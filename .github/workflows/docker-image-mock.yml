name: Mock Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@fbdef004eedaea7eca60573365396b34f41b4513
    with:
      dockerfile: Dockerfile.mock
      image_suffix: -mock
      publish_release: false
    secrets: inherit
    permissions:
      contents: write
      packages: write
