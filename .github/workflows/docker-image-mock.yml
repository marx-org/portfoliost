name: Mock Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@f06ee147e41e051c4a6a108e81823073ec57e350
    with:
      dockerfile: Dockerfile.mock
      image_suffix: -mock
      publish_release: false
    secrets: inherit
    permissions:
      contents: write
      packages: write
