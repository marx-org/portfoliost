name: Mock Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@19c638349f725dc2e816f28c7d203d127e0d93ce
    with:
      dockerfile: Dockerfile.mock
      image_suffix: -mock
      publish_release: false
    secrets: inherit
    permissions:
      contents: write
      packages: write
