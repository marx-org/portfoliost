services:
  example-service-mock:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: example-service-mock
    expose:
      - "4010"
    environment:
      EXAMPLE_SERVICE_MOCK_EMAIL: ${EXAMPLE_SERVICE_MOCK_EMAIL:-demo@example.com}
      EXAMPLE_SERVICE_MOCK_PASSWORD: ${EXAMPLE_SERVICE_MOCK_PASSWORD:-example-service-mock}
      EXAMPLE_SERVICE_MOCK_TOKEN: ${EXAMPLE_SERVICE_MOCK_TOKEN:-mock-dev-token}
    restart: unless-stopped

  portfoliost:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: portfoliost
    ports:
      - "3000:80"
    restart: unless-stopped

  krakend:
    image: krakend:2.13
    container_name: krakend
    ports:
      - "8080:8080"
    volumes:
      - ./krakend:/etc/krakend
    environment:
      FC_ENABLE: "1"
      FC_OUT: /tmp/krakend.json
      FC_TEMPLATES: /etc/krakend
      API_AUTH_URL: ${API_AUTH_URL:-http://example-service-mock:4010}
      API_USERS_URL: ${API_USERS_URL:-http://example-service-mock:4010}
      API_PORTFOLIOS_URL: ${API_PORTFOLIOS_URL:-http://example-service-mock:4010}
      API_WALLETS_URL: ${API_WALLETS_URL:-http://example-service-mock:4010}
      API_INSTRUMENTS_URL: ${API_INSTRUMENTS_URL:-http://example-service-mock:4010}
      API_WATCHLISTS_URL: ${API_WATCHLISTS_URL:-http://example-service-mock:4010}
      API_NOTIFICATIONS_URL: ${API_NOTIFICATIONS_URL:-http://example-service-mock:4010}
      API_NEWS_URL: ${API_NEWS_URL:-http://example-service-mock:4010}
      API_BILLING_URL: ${API_BILLING_URL:-http://example-service-mock:4010}
      API_CHARTING_URL: ${API_CHARTING_URL:-http://example-service-mock:4010}
      API_COPILOT_URL: ${API_COPILOT_URL:-http://example-service-mock:4010}
      API_LOGOS_URL: ${API_LOGOS_URL:-http://example-service-mock:4010}
      API_EXCHANGE_RATES_URL: ${API_EXCHANGE_RATES_URL:-http://example-service-mock:4010}
      API_SNAPTRADE_URL: ${API_SNAPTRADE_URL:-http://example-service-mock:4010}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://example-service-mock:4010}
      API_BACKEND_URL: ${API_BACKEND_URL:-http://example-service-mock:4010}
    command: ["krakend", "run", "-d", "-c", "/etc/krakend/krakend.json.tmpl"]
    restart: unless-stopped
