services:
  example-service-mock:
    build:
      context: .
      dockerfile: Dockerfile.mock
      secrets:
        - source: node_auth_token
          target: NODE_AUTH_TOKEN
    container_name: example-service-mock
    ports:
      - "4010:4010"
    environment:
      EXAMPLE_SERVICE_MOCK_EMAIL: ${EXAMPLE_SERVICE_MOCK_EMAIL:-demo@example.com}
      EXAMPLE_SERVICE_MOCK_PASSWORD: ${EXAMPLE_SERVICE_MOCK_PASSWORD:-example-service-mock}
      EXAMPLE_SERVICE_MOCK_TOKEN: ${EXAMPLE_SERVICE_MOCK_TOKEN:-mock-dev-token}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-mock-client}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://gateway:8080}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/auth/callback}
    restart: unless-stopped

  portfoliost:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_OIDC_ISSUER_URL: ${VITE_OIDC_ISSUER_URL:-http://localhost:4010}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-mock-client}
        VITE_PASSWORD_LOGIN_ENABLED: ${VITE_PASSWORD_LOGIN_ENABLED:-true}
      secrets:
        - source: node_auth_token
          target: NODE_AUTH_TOKEN
    container_name: portfoliost
    ports:
      - "3000:80"
    environment:
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:4010}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-mock-client}
      PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-true}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: portfoliost-postgres
    environment:
      POSTGRES_USER: portfoliost
      POSTGRES_PASSWORD: portfoliost
      POSTGRES_DB: portfoliost
    volumes:
      - ./docker/postgres/init-openst.sql:/docker-entrypoint-initdb.d/001-openst.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfoliost -d portfoliost"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  users-auth:
    build:
      context: ../portfoliost-users-auth
      dockerfile: Dockerfile
      secrets:
        - source: node_auth_token
          target: NODE_AUTH_TOKEN
    container_name: users-auth
    expose:
      - "3000"
    environment:
      POCKETID_ISSUER_URL: ${POCKETID_ISSUER_URL:-http://gateway:8080}
      POCKETID_AUDIENCE: ${POCKETID_AUDIENCE:-mock-client}
      DATABASE_URL: postgres://portfoliost:portfoliost@postgres:5432/portfoliost
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    container_name: portfoliost-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    env_file:
      - deploy/services.env
    depends_on:
      - example-service-mock
      - users-auth
      - instruments
      - wallets
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: portfoliost-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  openst:
    build:
      context: ../openst
      target: runtime
    container_name: portfoliost-openst
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgres://portfoliost:portfoliost@postgres:5432/openst
    env_file:
      - path: ../openst/.env
        required: false
    restart: unless-stopped

  cachest:
    build:
      context: ../cachest
      target: runtime
    container_name: portfoliost-cachest
    volumes:
      - ../cachest/config.yaml:/app/config.yaml:ro
    ports:
      - "8090:8080"
    depends_on:
      redis:
        condition: service_healthy
      openst:
        condition: service_started
    environment:
      REDIS_HOST: redis
    restart: unless-stopped

  wallets:
    build:
      context: ../portfoliost-wallets
      dockerfile: Dockerfile
      secrets:
        - source: node_auth_token
          target: NODE_AUTH_TOKEN
    container_name: portfoliost-wallets
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgres://portfoliost:portfoliost@postgres:5432/portfoliost
      USERS_AUTH_URL: http://users-auth:3000
      INSTRUMENTS_URL: http://instruments:3000
      # §63.10 — required by the snapshot sweep; must match the instruments service.
      INSTRUMENTS_SERVICE_TOKEN: ${INSTRUMENTS_SERVICE_TOKEN:-dev-instruments-service-token}
      # dev identity resolution for opaque mock tokens (never used in cluster)
      AUTH_ME_URL: http://example-service-mock:4010
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  instruments:
    build:
      context: ../portfoliost-instruments
      dockerfile: Dockerfile
      secrets:
        - source: node_auth_token
          target: NODE_AUTH_TOKEN
    container_name: portfoliost-instruments
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://portfoliost:portfoliost@postgres:5432/portfoliost
      CACHEST_URL: http://cachest:8080
      LOGOS_DIR: /app/data/logos
      # §63.10 — second accepted credential (serviceOrUserMiddleware). Pinned to a
      # committed dev value so local and cluster behave the same; the cluster reads
      # the real one from the SOPS cluster-secrets. Must match the wallets side.
      INSTRUMENTS_SERVICE_TOKEN: ${INSTRUMENTS_SERVICE_TOKEN:-dev-instruments-service-token}
    volumes:
      - ../portfoliost-instruments/data/logos:/app/data/logos
    depends_on:
      postgres:
        condition: service_healthy
      cachest:
        condition: service_started
    restart: unless-stopped

  # H2 — docker-compose stand-in for the production postgres_fdw stooq tables.
  # postgres_fdw is unavailable locally, so this one-shot creates plain local
  # stooq_daily_* tables + the unified price_bars_all view (post-migration) so
  # the H3+ read path can be exercised against the local stack. Never runs in
  # the cluster (not wired there); idempotent, exits after seeding.
  pricebars-sim:
    build:
      context: ../portfoliost-instruments
      dockerfile: Dockerfile
      secrets:
        - source: node_auth_token
          target: NODE_AUTH_TOKEN
    command: ["node", "dist/scripts/price-bars-sim.js"]
    environment:
      DATABASE_URL: postgres://portfoliost:portfoliost@postgres:5432/portfoliost
    depends_on:
      instruments:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: "no"

  admin:
    build:
      context: ../portfoliost-admin
      dockerfile: Dockerfile
      secrets:
        - source: node_auth_token
          target: NODE_AUTH_TOKEN
    container_name: portfoliost-admin
    expose:
      - "3000"
    environment:
      API_USERS_AUTH_URL: http://users-auth:3000
      API_WALLETS_URL: http://wallets:3000
      API_INSTRUMENTS_URL: http://instruments:3000
      API_OPENST_URL: http://openst:8080
      API_CACHEST_URL: http://cachest:8080
      DATABASE_URL: postgres://portfoliost:portfoliost@postgres:5432/portfoliost
      OPENST_DATABASE_URL: postgres://portfoliost:portfoliost@postgres:5432/openst
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://gateway:8080}
      OIDC_CLIENT_ID: ${ADMIN_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${ADMIN_OIDC_CLIENT_SECRET:-}
      # N — stooq import jobs (jobshot not in local compose; UI will fail gracefully at Run step)
      API_JOBSHOT_URL: ${API_JOBSHOT_URL:-}
      STOOQ_UPLOAD_DIR: /tmp/stooq-uploads
    depends_on:
      users-auth:
        condition: service_started
      wallets:
        condition: service_started
      instruments:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # D76 — one-shot seed service. Depends on all module containers being healthy
  # (their /health answers only after db:migrate, so every module schema exists
  # before any seed runs). Seeds are mock-only and never run in the cluster.
  mock-db-seed:
    build: { context: ".", dockerfile: Dockerfile.db-seed }
    environment:
      DATABASE_URL: postgres://portfoliost:portfoliost@postgres:5432/portfoliost
      OPENST_DATABASE_URL: postgres://portfoliost:portfoliost@postgres:5432/openst
      SEED_PORTFOLIOS: "true"
    depends_on:
      postgres:   { condition: service_healthy }
      openst:     { condition: service_healthy }
      users-auth: { condition: service_healthy }
      wallets:    { condition: service_healthy }
      instruments: { condition: service_healthy }
    restart: "no"

  # §24.8 — one-shot Google Sheets sync Job (k8s CronJob stand-in, plan §24.9).
  # Never auto-starts: lives in the `jobs` profile, so run it explicitly:
  #   docker compose run --rm sheets-sync node dist/sync.js --wipe
  # GOOGLE_* creds come from ./sheets-sync.env (gitignored; see .env.example).
  sheets-sync:
    build:
      context: ../portfoliost-sheets-sync
    container_name: portfoliost-sheets-sync
    profiles: ["jobs"]
    env_file:
      - path: ./sheets-sync.env
        required: false
    environment:
      WALLETS_API_URL: http://wallets:3000
      WALLETS_API_TOKEN: ${EXAMPLE_SERVICE_MOCK_TOKEN:-mock-dev-token}
      INSTRUMENTS_DATABASE_URL: postgres://portfoliost:portfoliost@postgres:5432/portfoliost
    depends_on:
      postgres: { condition: service_healthy }
      wallets:  { condition: service_healthy }
    restart: "no"

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN
